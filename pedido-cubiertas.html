<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido de cubiertas — Andreani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEFEC;
    --bg-panel:#ffffff;
    --ink:#1B1D1E;
    --ink-soft:#5B5F5C;
    --ink-faint:#8B8F8B;
    --line:#D8D8D2;
    --line-strong:#B8B9B2;
    --asphalt:#232A31;
    --asphalt-soft:#3A434C;
    --safety:#E15A0F;
    --safety-dark:#B4470B;
    --safety-bg:#FCE7DA;
    --ok:#2E6B3E;
    --ok-bg:#E3F0E4;
    --radius:10px;
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg,var(--asphalt) 0 22px,var(--safety) 22px 40px);
    z-index:50;
  }
  .wrap{max-width:840px;margin:0 auto;padding:34px 20px 80px;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--asphalt);
  }
  .subtitle{color:var(--ink-soft);font-size:14.5px;margin:2px 0 26px;}
  .plate{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-faint);
    border:1px solid var(--line-strong);
    border-radius:5px;
    padding:3px 9px;
    letter-spacing:0.5px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:18px;
  }
  .card h2{
    font-family:var(--font-display);
    font-weight:600;
    font-size:20px;
    margin:0 0 14px;
    color:var(--asphalt);
    display:flex;align-items:center;gap:10px;
  }
  .step-num{
    font-family:var(--font-mono);
    font-size:12px;
    background:var(--asphalt);
    color:#fff;
    width:22px;height:22px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  input[type=text],input[type=number],select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line-strong);
    border-radius:7px;
    font-size:15px;
    font-family:var(--font-body);
    background:#fff;
    color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--safety);outline-offset:1px;border-color:var(--safety);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}
  .field{margin-bottom:14px;}
  .medida-tag{
    font-family:var(--font-mono);
    font-weight:600;
    font-size:13px;
    background:var(--asphalt);
    color:#fff;
    padding:2px 8px;
    border-radius:4px;
    display:inline-block;
  }
  .opciones{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .opcion{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 13px;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .opcion:hover{border-color:var(--line-strong);background:#FAFAF8;}
  .opcion.selected{border-color:var(--safety);background:var(--safety-bg);}
  .opcion input[type=radio]{accent-color:var(--safety);width:17px;height:17px;flex-shrink:0;}
  .opcion .info{flex:1;min-width:0;}
  .opcion .modelo{font-weight:500;font-size:14.5px;color:var(--ink);}
  .opcion .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{
    font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
    padding:2px 7px;border-radius:4px;margin-right:6px;
  }
  .badge.premium{background:#E3EAF2;color:#2A4A6E;}
  .badge.alternativa{background:#EFE9DE;color:#6E5A2A;}
  .badge.mejor{background:var(--ok-bg);color:var(--ok);}
  .precio{font-family:var(--font-mono);font-weight:600;font-size:16px;color:var(--asphalt);white-space:nowrap;}
  .add-row{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .qty{width:64px;text-align:center;}
  button{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    border-radius:8px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    padding:10px 16px;
    cursor:pointer;
    transition:transform .08s, background .12s;
  }
  button:hover{background:#F5F4F1;}
  button:active{transform:scale(.98);}
  button.primary{
    background:var(--safety);
    border-color:var(--safety-dark);
    color:#fff;
  }
  button.primary:hover{background:var(--safety-dark);}
  button.primary:disabled{background:#D8D5CE;border-color:#D8D5CE;color:#999;cursor:not-allowed;}
  button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:6px 8px;}
  button.ghost:hover{color:var(--safety-dark);background:transparent;}
  .cart-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-item:last-child{border-bottom:none;}
  .cart-item .ci-info{flex:1;min-width:0;}
  .cart-item .ci-medida{font-family:var(--font-mono);font-weight:600;font-size:13.5px;}
  .cart-item .ci-modelo{font-size:13px;color:var(--ink-soft);}
  .cart-item .ci-precio{font-family:var(--font-mono);font-size:14px;white-space:nowrap;}
  .empty{color:var(--ink-faint);font-size:14px;text-align:center;padding:18px 0;}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:6px;border-top:2px solid var(--asphalt);}
  .total-row .label{font-family:var(--font-display);font-size:18px;color:var(--asphalt);}
  .total-row .amount{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--safety-dark);}
  .submit-bar{display:flex;justify-content:flex-end;margin-top:18px;}
  .confirm{
    text-align:center;padding:50px 20px;
  }
  .confirm .tick{
    width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;
  }
  .confirm h2{font-family:var(--font-display);font-size:26px;margin:0 0 6px;}
  .confirm .code{font-family:var(--font-mono);color:var(--ink-soft);font-size:14px;}
  .footer-link{
    text-align:center;margin-top:34px;
  }
  .footer-link a{color:var(--ink-faint);font-size:12px;text-decoration:none;cursor:pointer;}
  .footer-link a:hover{color:var(--safety-dark);text-decoration:underline;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--asphalt);background:#F5F4F1;position:sticky;top:0;}
  td.num{font-family:var(--font-mono);}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .stat{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;
  }
  .stat .n{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--asphalt);}
  .stat .l{font-size:12px;color:var(--ink-soft);}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:560px){.stats{grid-template-columns:1fr;}}
  .hidden{display:none !important;}
  .row-actions{display:flex;gap:6px;}
</style>
</head>

let cart = [];
let selectedMedida = null;
let selectedOpcionIdx = null;

function fmt(n){
  return Number(n).toLocaleString('es-AR', {maximumFractionDigits:0});
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = viewPedido();
  bindPedidoEvents();
}

function viewPedido(){
  const medidaOptions = CATALOGO.map(m => `<option value="${m.medida}">${m.medida}</option>`).join('');

  let opcionesHtml = '';
  if(selectedMedida){
    const entry = CATALOGO.find(m => m.medida === selectedMedida);
    const min = Math.min(...entry.opciones.map(o=>o.precio));
    opcionesHtml = `<div class="opciones">` + entry.opciones.map((o,i) => `
      <label class="opcion ${selectedOpcionIdx===i?'selected':''}" data-idx="${i}">
        <input type="radio" name="opcion" value="${i}" ${selectedOpcionIdx===i?'checked':''}>
        <div class="info">
          <div class="modelo">${o.modelo}</div>
          <div class="meta">
            <span class="badge ${o.categoria==='Premium'?'premium':'alternativa'}">${o.categoria}</span>
            ${o.precio===min?'<span class="badge mejor">Menor precio</span>':''}
            ${o.proveedor}
          </div>
        </div>
        <div class="precio">$${fmt(o.precio)}</div>
      </label>
    `).join('') + `</div>`;
  }

  const cartHtml = cart.length === 0
    ? `<div class="empty">Todavía no agregaste ninguna cubierta.</div>`
    : cart.map((c,i) => `
      <div class="cart-item">
        <div class="ci-info">
          <div class="ci-medida">${c.medida} <span style="color:var(--ink-faint);font-weight:400;">× ${c.cantidad}</span></div>
          <div class="ci-modelo">${c.proveedor} — ${c.modelo}</div>
        </div>
        <div class="ci-precio">$${fmt(c.precio * c.cantidad)}</div>
        <button class="ghost" onclick="removeFromCart(${i})" aria-label="Quitar">✕</button>
      </div>
    `).join('');

  const total = cart.reduce((s,c) => s + c.precio*c.cantidad, 0);

  return `
    <header class="top">
      <h1>Pedido de cubiertas</h1>
      <span class="plate">ANDREANI · TRANSPORTISTAS</span>
    </header>
    <p class="subtitle">Elegí la medida, comparás precios y mandás el pedido. Nosotros lo vemos del otro lado, sin planillas.</p>

    <div class="card">
      <h2><span class="step-num">1</span>Tus datos</h2>
      <div class="grid2">
        <div class="field">
          <label for="nombre">Nombre y apellido</label>
          <input type="text" id="nombre" placeholder="Ej: Juan Pérez" value="${(window.__nombre||'')}">
        </div>
        <div class="field">
          <label for="acreedor">N° de acreedor</label>
          <input type="text" id="acreedor" placeholder="Ej: 4521" value="${(window.__acreedor||'')}">
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="step-num">2</span>Elegí una cubierta</h2>
      <div class="field" style="margin-bottom:0;">
        <label for="medida-select">Medida</label>
        <select id="medida-select">
          <option value="">Seleccioná una medida...</option>
          ${medidaOptions}
        </select>
      </div>
      ${opcionesHtml}
      ${selectedMedida ? `
      <div class="add-row">
        <label style="margin:0;flex-shrink:0;">Cantidad</label>
        <input type="number" id="cantidad" class="qty" min="1" value="1">
        <button class="primary" id="btn-add" ${selectedOpcionIdx===null?'disabled':''}>Agregar al pedido</button>
      </div>` : ''}
    </div>

    <div class="card">
      <h2><span class="step-num">3</span>Tu pedido</h2>
      ${cartHtml}
      ${cart.length > 0 ? `
      <div class="total-row">
        <span class="label">Total</span>
        <span class="amount">$${fmt(total)}</span>
      </div>` : ''}
      <div class="submit-bar">
        <button class="primary" id="btn-submit" ${cart.length===0?'disabled':''}>Enviar pedido</button>
      </div>
    </div>

      `;
}

function bindPedidoEvents(){
  const nombreEl = document.getElementById('nombre');
  const acreedorEl = document.getElementById('acreedor');
  nombreEl.addEventListener('input', e => window.__nombre = e.target.value);
  acreedorEl.addEventListener('input', e => window.__acreedor = e.target.value);

  const medidaSelect = document.getElementById('medida-select');
  medidaSelect.value = selectedMedida || '';
  medidaSelect.addEventListener('change', e => {
    selectedMedida = e.target.value || null;
    selectedOpcionIdx = null;
    render();
  });

  document.querySelectorAll('.opcion').forEach(el => {
    el.addEventListener('click', () => {
      selectedOpcionIdx = parseInt(el.dataset.idx);
      render();
    });
  });

  const btnAdd = document.getElementById('btn-add');
  if(btnAdd){
    btnAdd.addEventListener('click', () => {
      const entry = CATALOGO.find(m => m.medida === selectedMedida);
      const o = entry.opciones[selectedOpcionIdx];
      const cantidad = Math.max(1, parseInt(document.getElementById('cantidad').value) || 1);
      cart.push({medida: selectedMedida, proveedor:o.proveedor, modelo:o.modelo, precio:o.precio, categoria:o.categoria, cantidad});
      selectedMedida = null;
      selectedOpcionIdx = null;
      render();
    });
  }

  const btnSubmit = document.getElementById('btn-submit');
  if(btnSubmit){
    btnSubmit.addEventListener('click', submitPedido);
  }
}

async function submitPedido(){
  const nombre = (document.getElementById('nombre').value || '').trim();
  const acreedor = (document.getElementById('acreedor').value || '').trim();
  if(!nombre || !acreedor){
    alert('Completá nombre y apellido y el número de acreedor antes de enviar.');
    return;
  }
  if(cart.length === 0) return;

  const id = 'PED-' + Date.now().toString(36).toUpperCase();
  const pedido = {
    id, fecha: new Date().toISOString(),
    nombre, acreedor,
    items: cart,
    total: cart.reduce((s,c)=>s+c.precio*c.cantidad,0)
  };

  const btnSubmit = document.getElementById('btn-submit');
  if(btnSubmit){ btnSubmit.disabled = true; btnSubmit.textContent = 'Enviando...'; }

  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(pedido)
    });
  }catch(err){
    alert('No se pudo enviar el pedido. Revisá tu conexión y probá de nuevo.');
    console.error(err);
    if(btnSubmit){ btnSubmit.disabled = false; btnSubmit.textContent = 'Enviar pedido'; }
    return;
  }

  cart = [];
  window.__nombre = '';
  window.__acreedor = '';
  showConfirm(id);
}

function showConfirm(id){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <h1>Pedido de cubiertas</h1>
      <span class="plate">ANDREANI · TRANSPORTISTAS</span>
    </header>
    <div class="card confirm">
      <div class="tick">✓</div>
      <h2>Pedido enviado</h2>
      <p style="color:var(--ink-soft);">Ya lo recibimos, en breve te contactamos para coordinar.</p>
      <p class="code">Código: ${id}</p>
      <div style="margin-top:22px;">
        <button class="primary" onclick="render()">Cargar otro pedido</button>
      </div>
    </div>
      `;
}

function removeFromCart(i){
  cart.splice(i,1);
  render();
}


render();
</script>
</body>
</html>
